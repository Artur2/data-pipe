[package]
name = "data-pipe"
version = "0.1.0"
edition = "2024"

[profile.release]
strip = true  # Automatically strip symbols from the binary.
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"

[dependencies]
sockudo-ws = { version = "3.0.0", features = ["full"] }
tokio = "1.53.1"
regex = "1.13.1"
log = "0.4.34"
simplelog = "0.12.2"
thiserror = "2.0.20"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
rand = "0.10.2"
uuid = { version = "1.26.1", features = ["v4"] }
xxhash-rust = { version = "0.8.18", features = ["xxh32"] }
parking_lot = "0.12.5"
mimalloc = { version = "0.1.52" }
rmp-serde = { version = "1.3.1" }
serde_bytes = "0.11.19"
rdkafka = "0.39.0"
tokio-util = { version = "0.7.19", features = ["rt"] }
futures-util = { version = "0.3", default-features = false }
governor = "0.10.4"
config = { version =  "0.15.27", features = ["toml"] }
clap = { version = "4.6.7", features = ["derive"] }
